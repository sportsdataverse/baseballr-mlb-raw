[project]
name = "baseballr-mlb-raw-python"
version = "0.1.0"
description = "MLB raw capture: MLB Stats API feed/live + Baseball Savant per-game Statcast, committed as gzipped payloads."
requires-python = ">=3.11"
dependencies = [
    # The transports live in sdv-py: mlb_api_extra (schedule, feed/live) and
    # mlb_statcast_runtime._get (the content-type-aware Savant getter).
    "sportsdataverse>=0.0.71",
    # savant.py parses the /statcast_search CSV into a frame before persisting.
    "polars>=1.0,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# The MLB surface this capture calls lives on sdv-py main, ahead of the last
# PyPI release -- same pin pattern as the sibling -raw/-data repos.
[tool.uv.sources]
sportsdataverse = { git = "https://github.com/sportsdataverse/sportsdataverse-py", branch = "main" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned rule set: relying on ruff defaults makes the gate version-sensitive.
select = ["E4", "E7", "E9", "F", "I"]
# Explicit polars bool masks (pl.col(...) == True) are the project convention.
ignore = ["E712"]
