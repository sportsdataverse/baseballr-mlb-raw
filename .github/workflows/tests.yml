name: tests

# Offline test gate. These tests touch no network -- the capture stages are
# exercised through injected transports, never live hosts.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Sparse: mlb/raw/ is a ~465 MB committed capture tree and no test
          # reads it. RUNBOOK.md is NOT data -- test_stage_numbering reads it,
          # and omitting it is exactly how that test fails with a
          # FileNotFoundError on a file that has been committed all along.
          sparse-checkout: |
            python
            tests
            scripts
            pyproject.toml
            uv.lock
            RUNBOOK.md
          sparse-checkout-cone-mode: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-dependency-glob: uv.lock

      - name: Install
        # --frozen: a PR must not silently re-resolve the lockfile.
        run: uv sync --frozen --dev

      - name: Tests
        # --no-sync: `uv run` would otherwise re-sync and undo the --frozen
        # install above.
        run: uv run --no-sync pytest -q

      - name: Lint
        run: uv run --no-sync ruff check python tests

      - name: Shell syntax
        # scripts/ is bash-only by convention; the scrape entry points are not
        # otherwise exercised by CI.
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" || exit 1
          done
